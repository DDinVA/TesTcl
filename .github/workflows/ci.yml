name: CI

on:
  push:
    branches: [master, release, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TCL_LSP_COMMIT: cad24955f16953c2443902efd83d9f7f95d9b648

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TesTcl
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.6
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Tcl/Tk runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes tcl tk

      - name: Check out pinned tcl-lsp
        env:
          TCL_LSP_ROOT: ${{ runner.temp }}/tcl-lsp
        run: |
          git clone --quiet https://github.com/bitwisecook/tcl-lsp.git "$TCL_LSP_ROOT"
          git -C "$TCL_LSP_ROOT" checkout --quiet --detach "$TCL_LSP_COMMIT"

      - name: Install Python dependencies
        run: uv sync --python 3.13 --dev

      - name: Run Python integration suite
        env:
          TCL_LSP_ROOT: ${{ runner.temp }}/tcl-lsp
          PYTHONPATH: .
        run: uv run --python 3.13 pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TesTcl
        uses: actions/checkout@v4

      - name: Build the portable emulator image
        run: docker build --build-arg TCL_LSP_COMMIT="$TCL_LSP_COMMIT" -f Dockerfile.emulator -t testcl-irule-emulator:ci .

      - name: Smoke test the portable emulator image
        run: |
          container_name="testcl-irule-emulator-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$$"
          raw_container_name="${container_name}-raw"
          trap 'docker rm --force "$container_name" "$raw_container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" \
            --publish 18080:8080 --publish 18081:18080 \
            testcl-irule-emulator:ci \
            --serve --host 0.0.0.0 --port 8080 \
            --data-plane-scenario /opt/testcl/examples/scenarios/live-http-17.5.json \
            --data-plane-host 0.0.0.0 --data-plane-port 18080
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/tmp/testcl-healthz.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          grep -F 'tmos-17.5' /tmp/testcl-healthz.json
          if ! curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/testcl-workbench.html; then
            docker logs "$container_name"
            exit 1
          fi
          grep -F 'TesTcl · TMOS 17.5 iRule workbench' /tmp/testcl-workbench.html
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/health >/tmp/testcl-data-plane.txt; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          grep -F 'hello from the modeled origin' /tmp/testcl-data-plane.txt

          docker run --detach --name "$raw_container_name" \
            --publish 18082:18082 \
            testcl-irule-emulator:ci \
            --data-plane --host 0.0.0.0 --port 18082 \
            --scenario /opt/testcl/examples/scenarios/live-tcp-17.5.json
          for attempt in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/18082) 2>/dev/null; then
              exec 3>&- 3<&-
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$raw_container_name"
              exit 1
            fi
            sleep 1
          done
          python3 - <<'PY'
          import socket

          expected = b"container-tcp"
          received = bytearray()
          with socket.create_connection(("127.0.0.1", 18082), timeout=5) as client:
              client.sendall(expected)
              while len(received) < len(expected):
                  try:
                      chunk = client.recv(len(expected) - len(received))
                  except ConnectionResetError:
                      break
                  if not chunk:
                      break
                  received.extend(chunk)
          if bytes(received) != expected:
              raise SystemExit(
                  f"raw TCP smoke response mismatch: {bytes(received)!r}"
              )
          print(bytes(received).decode("ascii"))
          PY
