              --catalog-dir /tmp/testcl-catalog-worker \
              --output-dir /tmp/testcl-catalog-capture-batch \
              --variants 1 --capture-id ci-exported >/tmp/testcl-catalog-batch.json
            python /opt/testcl/tools/catalog-smoke-check.py \
              --catalog-manifest /tmp/testcl-catalog-worker/manifest.json \
              --worker-report /tmp/testcl-catalog-worker.json \
              --batch-report /tmp/testcl-catalog-batch.json
          '

          docker run --detach --name "$raw_container_name" \
            --publish 18082:18082 \
            testcl-irule-emulator:ci \
            --data-plane --host 0.0.0.0 --port 18082 \
            --scenario /opt/testcl/examples/scenarios/live-tcp-17.5.json
          set +e
          uv run --python 3.13 python - <<'PY'
          import socket
          import time

          expected = b"container-tcp"
          deadline = time.monotonic() + 30
          last_error = RuntimeError("no connection attempt completed")
          while time.monotonic() < deadline:
              received = bytearray()
              try:
                  with socket.create_connection(("127.0.0.1", 18082), timeout=2) as client:
                      client.settimeout(2)
                      client.sendall(expected)
                      while len(received) < len(expected):
                          chunk = client.recv(len(expected) - len(received))
                          if not chunk:
                              break
                          received.extend(chunk)
                  if bytes(received) == expected:
                      print(bytes(received).decode("ascii"))
                      break
                  last_error = RuntimeError(
                      f"response mismatch: {bytes(received)!r}"
                  )
              except OSError as exc:
                  last_error = exc
              time.sleep(0.5)
          else:
              raise SystemExit(f"raw TCP smoke failed: {last_error!r}")
          PY
          raw_status=$?
          set -e
          if [ "$raw_status" -ne 0 ]; then
            docker logs "$raw_container_name"
            exit "$raw_status"
          fi

          docker run --detach --name "$sip_container_name" \
            --publish 18083:18083 \
            testcl-irule-emulator:ci \
            --data-plane --host 0.0.0.0 --port 18083 \
            --scenario /opt/testcl/examples/scenarios/live-sip-tcp-17.5.json
          set +e
          uv run --python 3.13 python - <<'PY'
          import socket
          import time

          request = (
              b"OPTIONS sip:service.example.com SIP/2.0\r\n"
              b"Via: SIP/2.0/TCP client.example.com;branch=z9\r\n"
              b"From: <sip:alice@example.com>;tag=1\r\n"
              b"To: <sip:service.example.com>\r\n"
              b"Call-ID: ci-sip-tcp\r\n"
              b"CSeq: 1 OPTIONS\r\n"
              b"Content-Length: 0\r\n\r\n"
          )
          expected = b"SIP/2.0 200 OK\r\n"
          deadline = time.monotonic() + 30
          last_error = RuntimeError("no connection attempt completed")
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 18083), timeout=2) as client:
                      client.settimeout(2)
                      midpoint = 37
                      client.sendall(request[:midpoint])
                      client.sendall(request[midpoint:])
                      received_buffer = bytearray()
                      while b"\r\n\r\n" not in received_buffer:
                          chunk = client.recv(4096)
                          if not chunk:
                              break
                          received_buffer.extend(chunk)
                          if len(received_buffer) > 1 << 20:
                              raise RuntimeError("SIP response exceeded the smoke-test limit")
                      received = bytes(received_buffer)
                  if received.startswith(expected) and received.endswith(
                      b"Content-Length: 0\r\n\r\n"
                  ):
                      print(received.decode("utf-8"))
                      break
                  last_error = RuntimeError(f"response mismatch: {received!r}")
              except OSError as exc:
                  last_error = exc
              time.sleep(0.5)
          else:
              raise SystemExit(f"SIP/TCP smoke failed: {last_error!r}")
          PY
          sip_status=$?
          set -e
          if [ "$sip_status" -ne 0 ]; then
            docker logs "$sip_container_name"
            exit "$sip_status"
          fi

      - name: Smoke test the Compose UDP upstream workbench
        run: |
          uv venv --python 3.13 --allow-existing .venv
          ./scripts/live-udp-upstream-compose-smoke.sh
          ./scripts/live-http-upstream-compose-smoke.sh
