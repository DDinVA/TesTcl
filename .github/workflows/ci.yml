name: CI

on:
  push:
    branches: [master, release, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TCL_LSP_COMMIT: cad24955f16953c2443902efd83d9f7f95d9b648

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TesTcl
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.6
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Tcl/Tk runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes tcl tk

      - name: Check out pinned tcl-lsp
        env:
          TCL_LSP_ROOT: ${{ runner.temp }}/tcl-lsp
        run: |
          git clone --quiet https://github.com/bitwisecook/tcl-lsp.git "$TCL_LSP_ROOT"
          git -C "$TCL_LSP_ROOT" checkout --quiet --detach "$TCL_LSP_COMMIT"

      - name: Install Python dependencies
        run: uv sync --python 3.13 --dev

      - name: Run Python integration suite
        env:
          TCL_LSP_ROOT: ${{ runner.temp }}/tcl-lsp
          PYTHONPATH: .
        run: uv run --python 3.13 pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TesTcl
        uses: actions/checkout@v4

      - name: Build the portable emulator image
        run: |
          docker compose config --quiet
          docker build --build-arg TCL_LSP_COMMIT="$TCL_LSP_COMMIT" -f Dockerfile.emulator -t testcl-irule-emulator:ci .

      - name: Smoke test the portable emulator image
        run: |
          container_name="testcl-irule-emulator-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$$"
          raw_container_name="${container_name}-raw"
          trap 'docker rm --force "$container_name" "$raw_container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" \
            --publish 18080:8080 --publish 18081:18080 \
            testcl-irule-emulator:ci \
            --serve --host 0.0.0.0 --port 8080 \
            --data-plane-scenario /opt/testcl/examples/scenarios/live-http-17.5.json \
            --data-plane-host 0.0.0.0 --data-plane-port 18080
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/tmp/testcl-healthz.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          grep -F 'tmos-17.5' /tmp/testcl-healthz.json
          if ! curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/testcl-workbench.html; then
            docker logs "$container_name"
            exit 1
          fi
          grep -F 'TesTcl · TMOS 17.5 iRule workbench' /tmp/testcl-workbench.html
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/health >/tmp/testcl-data-plane.txt; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          grep -F 'hello from the modeled origin' /tmp/testcl-data-plane.txt

          docker run --rm testcl-irule-emulator:ci --behavior-coverage >/tmp/testcl-behavior-coverage.json
          grep -F '"target_f5_command_count":989' /tmp/testcl-behavior-coverage.json
          grep -F '"covered_command_count":389' /tmp/testcl-behavior-coverage.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/aaa-17.5.json \
            >/tmp/testcl-aaa-pack.json
          grep -F '"status":"passed"' /tmp/testcl-aaa-pack.json
          grep -F '"case_count":3' /tmp/testcl-aaa-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/category-17.5.json \
            >/tmp/testcl-category-pack.json
          grep -F '"status":"passed"' /tmp/testcl-category-pack.json
          grep -F '"case_count":6' /tmp/testcl-category-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/http2-17.5.json \
            >/tmp/testcl-http2-pack.json
          grep -F '"status":"passed"' /tmp/testcl-http2-pack.json
          grep -F '"case_count":11' /tmp/testcl-http2-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/route-17.5.json \
            >/tmp/testcl-route-pack.json
          grep -F '"status":"passed"' /tmp/testcl-route-pack.json
          grep -F '"case_count":10' /tmp/testcl-route-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/tmm-17.5.json \
            >/tmp/testcl-tmm-pack.json
          grep -F '"status":"passed"' /tmp/testcl-tmm-pack.json
          grep -F '"case_count":5' /tmp/testcl-tmm-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/flowtable-17.5.json \
            >/tmp/testcl-flowtable-pack.json
          grep -F '"status":"passed"' /tmp/testcl-flowtable-pack.json
          grep -F '"case_count":7' /tmp/testcl-flowtable-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/classification-17.5.json \
            >/tmp/testcl-classification-pack.json
          grep -F '"status":"passed"' /tmp/testcl-classification-pack.json
          grep -F '"case_count":10' /tmp/testcl-classification-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/profile-17.5.json \
            >/tmp/testcl-profile-pack.json
          grep -F '"status":"passed"' /tmp/testcl-profile-pack.json
          grep -F '"case_count":25' /tmp/testcl-profile-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/mr-17.5.json \
            >/tmp/testcl-mr-pack.json
          grep -F '"status":"passed"' /tmp/testcl-mr-pack.json
          grep -F '"case_count":23' /tmp/testcl-mr-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/http-edge-17.5.json \
            >/tmp/testcl-http-edge-pack.json
          grep -F '"status":"passed"' /tmp/testcl-http-edge-pack.json
          grep -F '"case_count":23' /tmp/testcl-http-edge-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/mqtt-17.5.json \
            >/tmp/testcl-mqtt-pack.json
          grep -F '"status":"passed"' /tmp/testcl-mqtt-pack.json
          grep -F '"case_count":29' /tmp/testcl-mqtt-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/tcp-controls-17.5.json \
            >/tmp/testcl-tcp-controls-pack.json
          grep -F '"status":"passed"' /tmp/testcl-tcp-controls-pack.json
          grep -F '"case_count":2' /tmp/testcl-tcp-controls-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/ssl-controls-17.5.json \
            >/tmp/testcl-ssl-controls-pack.json
          grep -F '"status":"passed"' /tmp/testcl-ssl-controls-pack.json
          grep -F '"case_count":2' /tmp/testcl-ssl-controls-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/antifraud-controls-17.5.json \
            >/tmp/testcl-antifraud-controls-pack.json
          grep -F '"status":"passed"' /tmp/testcl-antifraud-controls-pack.json
          grep -F '"case_count":2' /tmp/testcl-antifraud-controls-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/tcp-introspection-17.5.json \
            >/tmp/testcl-tcp-introspection-pack.json
          grep -F '"status":"passed"' /tmp/testcl-tcp-introspection-pack.json
          grep -F '"case_count":15' /tmp/testcl-tcp-introspection-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-pack /opt/testcl/examples/behavior-packs/dns-controls-17.5.json \
            >/tmp/testcl-dns-controls-pack.json
          grep -F '"status":"passed"' /tmp/testcl-dns-controls-pack.json
          grep -F '"case_count":21' /tmp/testcl-dns-controls-pack.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-candidates --namespace HTTP --limit 1 \
            >/tmp/testcl-behavior-candidates.json
          grep -F '"candidate_command_count":1' /tmp/testcl-behavior-candidates.json
          grep -F '"plan_observation_count":1' /tmp/testcl-behavior-candidates.json
          docker run --rm testcl-irule-emulator:ci \
            --behavior-sweep --namespace HTTP --offset 7 --limit 1 --variants 4 \
            >/tmp/testcl-behavior-sweep.json
          grep -F '"variant_count":4' /tmp/testcl-behavior-sweep.json
          grep -F '"executed_count":4' /tmp/testcl-behavior-sweep.json
          grep -F '"ok":4' /tmp/testcl-behavior-sweep.json

          docker run --detach --name "$raw_container_name" \
            --publish 18082:18082 \
            testcl-irule-emulator:ci \
            --data-plane --host 0.0.0.0 --port 18082 \
            --scenario /opt/testcl/examples/scenarios/live-tcp-17.5.json
          set +e
          python3 - <<'PY'
          import socket
          import time

          expected = b"container-tcp"
          deadline = time.monotonic() + 30
          last_error = RuntimeError("no connection attempt completed")
          while time.monotonic() < deadline:
              received = bytearray()
              try:
                  with socket.create_connection(("127.0.0.1", 18082), timeout=2) as client:
                      client.settimeout(2)
                      client.sendall(expected)
                      while len(received) < len(expected):
                          chunk = client.recv(len(expected) - len(received))
                          if not chunk:
                              break
                          received.extend(chunk)
                  if bytes(received) == expected:
                      print(bytes(received).decode("ascii"))
                      break
                  last_error = RuntimeError(
                      f"response mismatch: {bytes(received)!r}"
                  )
              except OSError as exc:
                  last_error = exc
              time.sleep(0.5)
          else:
              raise SystemExit(f"raw TCP smoke failed: {last_error!r}")
          PY
          raw_status=$?
          set -e
          if [ "$raw_status" -ne 0 ]; then
            docker logs "$raw_container_name"
            exit "$raw_status"
          fi
