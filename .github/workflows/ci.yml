name: CI

on:
  push:
    branches: [master, release, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testcl-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TCL_LSP_COMMIT: cad24955f16953c2443902efd83d9f7f95d9b648

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TesTcl
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.6
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Tcl/Tk runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes tcl tk

      - name: Check out pinned tcl-lsp
        env:
          TCL_LSP_ROOT: ${{ runner.temp }}/tcl-lsp
        run: |
          git clone --quiet https://github.com/bitwisecook/tcl-lsp.git "$TCL_LSP_ROOT"
          git -C "$TCL_LSP_ROOT" checkout --quiet --detach "$TCL_LSP_COMMIT"

      - name: Install Python dependencies
        run: uv sync --python 3.13 --dev

      - name: Run Python integration suite
        env:
          TCL_LSP_ROOT: ${{ runner.temp }}/tcl-lsp
          PYTHONPATH: .
        run: uv run --python 3.13 pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TesTcl
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.6
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build the portable emulator image
        run: |
          docker compose config --quiet
          docker build --build-arg TCL_LSP_COMMIT="$TCL_LSP_COMMIT" -f Dockerfile.emulator -t testcl-irule-emulator:ci .

      - name: Smoke test the portable container harness
        run: |
          TESTCL_IMAGE=testcl-irule-emulator:ci ./scripts/container-smoke-17.5.sh --no-build

      - name: Smoke test the portable emulator image
        run: |
          container_name="testcl-irule-emulator-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$$"
          raw_container_name="${container_name}-raw"
          sip_container_name="${container_name}-sip"
          trap 'docker rm --force "$container_name" "$raw_container_name" "$sip_container_name" >/dev/null 2>&1 || true' EXIT
          retry_curl() {
            local output_path="$1"
            local attempt
            shift
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$@" >"$output_path"; then
                return 0
              fi
              if [ "$attempt" -lt 30 ]; then
                sleep 1
              fi
            done
            docker logs "$container_name"
            return 1
          }
          docker run --detach --name "$container_name" \
            --publish 18080:8080 --publish 18081:18080 \
            testcl-irule-emulator:ci \
            --serve --host 0.0.0.0 --port 8080 \
            --data-plane-scenario /opt/testcl/examples/scenarios/live-http-17.5.json \
            --data-plane-host 0.0.0.0 --data-plane-port 18080
          retry_curl /tmp/testcl-healthz.json http://127.0.0.1:18080/healthz
          grep -F 'tmos-17.5' /tmp/testcl-healthz.json
          retry_curl /tmp/testcl-workbench.html http://127.0.0.1:18080/
          grep -F 'TesTcl · TMOS 17.5 iRule workbench' /tmp/testcl-workbench.html
          grep -F 'Evaluate local chunk' /tmp/testcl-workbench.html
          retry_curl /tmp/testcl-capability-chunk.json \
            'http://127.0.0.1:18080/v1/capabilities?namespace=HTTP&target_status=available-in-tmos-17.5&limit=2'
          jq -n --slurpfile chunk /tmp/testcl-capability-chunk.json \
            '{chunk: $chunk[0], mode: "both", variants: 1}' \
            >/tmp/testcl-catalog-evaluation-request.json
          retry_curl /tmp/testcl-catalog-evaluation.json -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/testcl-catalog-evaluation-request.json \
            http://127.0.0.1:18080/v1/catalog-chunk-evaluate
          grep -F '"status":"ok"' /tmp/testcl-catalog-evaluation.json
          grep -F '"target_command_count":2' /tmp/testcl-catalog-evaluation.json
          retry_curl /tmp/testcl-data-plane.txt http://127.0.0.1:18081/health
          grep -F 'hello from the modeled origin' /tmp/testcl-data-plane.txt

          docker run --rm testcl-irule-emulator:ci --behavior-coverage >/tmp/testcl-behavior-coverage.json
